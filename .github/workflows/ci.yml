name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ruff
        run: |
          python -m pip install --upgrade pip ruff
          ruff check src tests apps scripts examples validation

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    env:
      MPLCONFIGDIR: /tmp/mpl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests with coverage
        run: pytest --cov=tropical_wave_tools --cov-report=term-missing:skip-covered

  optional-dependencies:
    # xeofs and cartopy are optional; the tests that need them skip themselves in the matrix above.
    runs-on: ubuntu-latest
    env:
      MPLCONFIGDIR: /tmp/mpl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project with the optional dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,advanced,maps]"
          python -c "import xeofs, cartopy"
      - name: Run the xeofs and cartopy tests
        run: pytest -rs tests/test_xeofs_backend.py tests/test_plotting_rendering.py

  docs:
    runs-on: ubuntu-latest
    env:
      MPLCONFIGDIR: /tmp/mpl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build documentation
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"
          python -m mkdocs build

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and inspect the wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
          python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          required = [
              "tropical_wave_tools/plotting/spectrum.py",
              "tropical_wave_tools/atlas/events.py",
              "tropical_wave_tools/data/olr_equatorial_1979.nc",
          ]
          missing = [r for r in required if not any(n.endswith(r) for n in names)]
          assert not missing, f"missing from the wheel: {missing}"
          PY
